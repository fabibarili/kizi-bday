<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b1440">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kizi Bday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1440;--night:#120c2e;--pink:#ff3d81;--yellow:#ffd23f;--teal:#2ec4b6;--orange:#ff7a3d;--paper:#fff6e0}
*{box-sizing:border-box;margin:0;font-variant-ligatures:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--ink);overscroll-behavior:none}
body{color:var(--paper);font-family:VT323,ui-monospace,monospace;font-size-adjust:.56;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#jogo{position:fixed;left:50%;top:50%;width:360px;height:720px;overflow:hidden;background:var(--ink);transform-origin:center}
canvas{position:absolute;inset:0;width:360px;height:720px;image-rendering:pixelated;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none}
#ui>*{position:absolute}
.logo{left:0;right:0;text-align:center;font-family:"Press Start 2P",monospace;font-size-adjust:none;font-size:28px;line-height:1;color:var(--yellow);text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--night)}
.bubble{background:var(--paper);color:var(--ink);border:4px solid var(--night);box-shadow:4px 4px 0 var(--night);padding:10px 12px;font-size:21px;line-height:1.12;font-weight:600;text-align:center}
.bubble:after{content:"";position:absolute;width:14px;height:14px;background:var(--paper);border-right:4px solid var(--night);border-bottom:4px solid var(--night);bottom:-10px;left:var(--tail,50%);transform:rotate(45deg)}
.bubble.left:after{left:-10px;top:24px;bottom:auto;transform:rotate(135deg)}
.btn{display:flex;align-items:center;justify-content:center;min-height:56px;border:4px solid var(--night);box-shadow:0 5px 0 var(--night);font:400 25px VT323,monospace;font-size-adjust:.56;color:var(--ink);background:var(--yellow);text-align:center;pointer-events:auto;cursor:pointer;padding:0 6px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--night)}
.btn:focus-visible{outline:3px solid var(--paper);outline-offset:2px}
.pink{background:var(--pink);color:#fff}.teal{background:var(--teal)}.orange{background:var(--orange)}
.big{min-height:72px;font-size:30px}
.card{background:var(--night);border:4px solid var(--yellow);color:var(--paper);text-align:center;padding:12px;font-size:23px;line-height:1.15;font-weight:600}
.card em{font-style:normal;color:var(--yellow)}
.title{left:8px;right:8px;text-align:center;font-size:30px;line-height:1.05;font-weight:700;color:var(--yellow)}
#fx{display:none;z-index:5;pointer-events:none}
#fx.on{display:block;pointer-events:auto}
.pop{animation:pop .34s steps(6) var(--d,0s) backwards}
.logo span{display:inline-block;animation:letra .5s steps(7) calc(var(--i)*55ms + var(--d,0s)) backwards,onda 2.4s steps(10) calc(var(--i)*90ms + 1.2s) infinite}
.btn{overflow:hidden;animation:entra .36s steps(6) var(--d,0s) backwards}
.btn.cta{animation:entra .36s steps(6) var(--d,0s) backwards,pulsa 1.5s steps(4) calc(var(--d,0s) + .7s) infinite}
.btn.cta:before{content:"";position:absolute;top:-4px;bottom:-4px;left:-40%;width:24px;background:rgba(255,255,255,.45);transform:skewX(-20deg);pointer-events:none;animation:brilho 2.6s steps(14) 1s infinite}
.btn:disabled{animation:none;opacity:.75}.btn:disabled:before{display:none}
.card{animation:entra .36s steps(6) var(--d,0s) backwards,borda 1.2s steps(1) 1s infinite}
.title.pop{animation:pop .34s steps(6) backwards,cor 1s steps(1) .4s infinite}
.falta{visibility:hidden}
.revela{display:inline-block;animation:revela .3s steps(5)}
@keyframes revela{0%{translate:0 -14px;scale:1.5;opacity:0}60%{translate:0 2px;scale:1.15;opacity:1}100%{translate:0 0;scale:1}}
@keyframes pop{0%{scale:.6;opacity:0}60%{scale:1.08;opacity:1}100%{scale:1}}
@keyframes entra{from{translate:0 34px;opacity:0}to{translate:0 0;opacity:1}}
@keyframes letra{0%{translate:0 -70px;opacity:0}65%{translate:0 5px;opacity:1}100%{translate:0 0}}
@keyframes onda{0%,30%,100%{translate:0 0}15%{translate:0 -6px}}
@keyframes pulsa{0%,100%{scale:1}50%{scale:1.035}}
@keyframes brilho{0%{left:-40%}45%,100%{left:120%}}
@keyframes borda{0%,100%{border-color:var(--yellow)}50%{border-color:var(--pink)}}
@keyframes cor{0%,100%{color:var(--yellow)}50%{color:var(--paper)}}
@media (prefers-reduced-motion:reduce){*,*:before{animation:none!important}}
</style>
